# Replace the SMTP details. For Gmail use an app password; keep real values out of Git
# (mount the real file on the server or template it from a secret).
global:
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: alerts@example.com
  smtp_auth_username: alerts@example.com
  smtp_auth_password: CHANGE_ME_APP_PASSWORD
  smtp_require_tls: true

route:
  receiver: email-admin
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: email-admin
    email_configs:
      - to: you@example.com
        send_resolved: true
