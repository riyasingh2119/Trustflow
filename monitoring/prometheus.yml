# Scrapes the TrustFlow backend (Spring Actuator / Micrometer) and Node Exporter every 15 seconds.
# docker compose: targets resolve by service name.
# EC2: replace with the private IPs of the app, ci and monitoring nodes (see docs/DEPLOYMENT.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: trustflow-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Kubernetes variant (uncomment when Prometheus runs inside the cluster; pods carry prometheus.io annotations)
