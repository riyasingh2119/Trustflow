apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: trustflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: trustflow
  labels: { app: postgres, project: trustflow }
spec:
  replicas: 1
  strategy:
    type: Recreate          # single writer on a ReadWriteOnce volume
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres, project: trustflow }
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: trustflow }
            - { name: POSTGRES_USER, value: trustflow }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: trustflow-secrets, key: DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "trustflow", "-d", "trustflow"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "trustflow", "-d", "trustflow"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: trustflow
spec:
  type: ClusterIP
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
