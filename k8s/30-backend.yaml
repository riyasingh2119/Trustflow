apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustflow-backend
  namespace: trustflow
  labels: { app: trustflow-backend, project: trustflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: trustflow-backend }
  template:
    metadata:
      labels: { app: trustflow-backend, project: trustflow }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: backend
          image: riyasingh/trustflow-backend:1.0     # replaced by Jenkins: kubectl set image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: trustflow-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: trustflow-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: trustflow-secrets, key: JWT_SECRET } }
            - name: ALERT_URL
              valueFrom: { secretKeyRef: { name: trustflow-secrets, key: ALERT_URL, optional: true } }
            - name: ALERT_KEY
              valueFrom: { secretKeyRef: { name: trustflow-secrets, key: ALERT_KEY, optional: true } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trustflow-backend
  namespace: trustflow
spec:
  type: ClusterIP
  selector: { app: trustflow-backend }
  ports:
    - port: 8080
      targetPort: 8080
