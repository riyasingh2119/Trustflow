# k3s ships Traefik, so the class is "traefik". For ingress-nginx change ingressClassName to "nginx".
# For HTTPS add a tls: section with a certificate secret (cert-manager or a self-signed secret for the demo).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustflow
  namespace: trustflow
spec:
  ingressClassName: traefik
  rules:
    - host: trustflow.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: trustflow-backend, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: trustflow-frontend, port: { number: 80 } }
