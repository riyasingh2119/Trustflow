apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustflow-frontend
  namespace: trustflow
  labels: { app: trustflow-frontend, project: trustflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: trustflow-frontend }
  template:
    metadata:
      labels: { app: trustflow-frontend, project: trustflow }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: frontend
          image: riyasingh/trustflow-frontend:1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: BACKEND_URL, value: "http://trustflow-backend:8080" }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: trustflow-frontend
  namespace: trustflow
spec:
  type: ClusterIP
  selector: { app: trustflow-frontend }
  ports:
    - port: 80
      targetPort: 8080
