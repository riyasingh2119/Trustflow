# Needs metrics-server (bundled with k3s).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trustflow-backend
  namespace: trustflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trustflow-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
