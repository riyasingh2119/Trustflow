# Local development: docker compose up --build
#   app:        http://localhost:8081   (React via Nginx, /api proxied to the backend)
#   backend:    http://localhost:8080
# Observability stack: docker compose --profile monitoring up -d
#   Prometheus  http://localhost:9090   Grafana http://localhost:3000   Alertmanager http://localhost:9093
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trustflow
      POSTGRES_USER: trustflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustflow -d trustflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: trustflow-backend:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trustflow
      DB_USER: trustflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:-trustflow}
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-0123456789}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://localhost:5173}
      DEMO_MODE: ${DEMO_MODE:-true}
      APP_TZ: ${APP_TZ:-Asia/Kolkata}
      ALERT_URL: ${ALERT_URL:-}
      ALERT_KEY: ${ALERT_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    image: trustflow-frontend:dev
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8081:8080"

  # ---------------- monitoring profile ----------------
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.2
    pid: host
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pgdata:
  grafana-data:
